<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | HTZ APPs</title>
<meta name="description" content="La página que buscas no existe. Vuelve al catálogo de juegos de HTZ APPs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.err-hero{min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1rem;background:radial-gradient(circle,#c9c7bd 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
.err-code{font-size:clamp(5rem,18vw,10rem);font-weight:800;line-height:1;color:var(--navy);letter-spacing:-.05em;display:block;margin-bottom:.5rem}
.err-hero h1{font-size:clamp(1.6rem,4vw,2.4rem);margin-bottom:1rem}
.err-hero p{color:var(--muted);max-width:380px;margin:0 auto 2.4rem;font-size:1.1rem}
.err-links{display:flex;gap:1.2rem;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<header class="nav">
  <div class="container nav-inner">
    <a href="index.html" class="brand"><strong>HTZ APPs</strong></a>
    <nav class="links mono">
      <a href="index.html#catalogo">Catálogo</a>
      <a class="btn btn-sm" href="https://play.google.com/store/apps/developer?id=HTZ+APPs" target="_blank" rel="noopener">Google Play ↗</a>
      <button id="dark-toggle" class="dark-toggle" aria-label="Cambiar tema" title="Cambiar tema">🌙</button>
    </nav>
  </div>
</header>

<main>
  <div class="err-hero">
    <div class="container">
      <span class="err-code">404</span>
      <h1>Página no encontrada</h1>
      <p>La página que buscas no existe o ha cambiado de dirección. Vuelve al catálogo y elige tu próximo juego.</p>
      <div class="err-links">
        <a class="btn" href="index.html">← Volver al inicio</a>
        <a class="btn" href="index.html#catalogo" style="background:#fff;color:var(--ink)">Ver catálogo</a>
      </div>
    </div>
  </div>
</main>

<footer class="footer">
  <div class="container foot-inner">
    <div><strong>HTZ APPs</strong></div>
    <nav class="mono">
      <a href="https://play.google.com/store/apps/developer?id=HTZ+APPs" target="_blank" rel="noopener">Google Play</a>
    </nav>
    <small class="mono">© <span id="year"></span> HTZ APPs · <span class="foot-version">v1.0.2</span> · Made with 💙</small>
  </div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

// --- dark mode ---
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('dark-toggle');
  const saved = localStorage.getItem('theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const apply = t => {
    root.setAttribute('data-theme', t);
    if(btn) btn.textContent = t==='dark' ? '☀️' : '🌙';
    localStorage.setItem('theme', t);
  };
  apply(saved || (prefersDark ? 'dark' : 'light'));
  if(btn) btn.addEventListener('click', () => {
    apply(root.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
  });
})();

// --- sticky nav blur ---
(function(){
  const nav = document.querySelector('.nav');
  if(!nav) return;
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 10);
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();
})();

// --- scroll reveal ---
(function(){
  const els = document.querySelectorAll('.reveal');
  if(!els.length) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => { if(e.isIntersecting){ e.target.classList.add('visible'); io.unobserve(e.target); } });
  }, {threshold:0.08});
  els.forEach(el => io.observe(el));
})();

// --- share button (solo disponible en dispositivos móviles) ---
(function(){
  const btn = document.getElementById('share-btn');
  if(!btn) return;
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ||
    (navigator.maxTouchPoints > 1 && /Macintosh/i.test(navigator.userAgent));
  if(!isMobile || !navigator.share){
    btn.remove();
    return;
  }
  btn.style.display = 'inline-flex';
  btn.addEventListener('click', async () => {
    try{
      await navigator.share({
        title: document.title,
        text: document.querySelector('meta[name="description"]')?.content || document.title,
        url: window.location.href
      });
    }catch(e){}
  });
})();

</script>
</body>
</html>
